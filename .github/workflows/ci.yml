name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Benchmark budgets (headless)
        run: pnpm run bench:ci

      - name: GPU smoke test (real WebGL2 via SwiftShader)
        run: node scripts/gpu-smoke/run.mjs

      - name: Build
        run: pnpm run build

      - name: Bundle size budget (11-symbol import)
        run: pnpm run size:check

      - name: Packed package smoke test
        run: node scripts/publish-packages.mjs smoke
